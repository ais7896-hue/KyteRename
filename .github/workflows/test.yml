name: Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Test Suite
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python run_tests.py 2>&1 | tee test_log.txt

      - name: Expose Failure Details
        if: failure()
        shell: bash
        run: |
          tail -n 25 test_log.txt | while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::error title=TestFailure::$line"
            fi
          done
